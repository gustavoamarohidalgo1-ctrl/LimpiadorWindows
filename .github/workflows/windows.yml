name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Compilar y probar
        shell: pwsh
        run: |
          $logDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/ci'
          New-Item -ItemType Directory -Path $logDirectory -Force | Out-Null
          dotnet build LimpiadorUltraWindows.slnx -c Release 2>&1 | Tee-Object -FilePath "$logDirectory/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixtureRoot = Join-Path ([System.IO.Path]::GetTempPath()) 'LimpiadorWindows-ci-fixtures'
          New-Item -ItemType Directory -Path $fixtureRoot -Force | Out-Null
          "LIMPIADOR_CI_FIXTURES=$fixtureRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:TEMP = $fixtureRoot
          $env:TMP = $fixtureRoot
          dotnet run --project tests/Limpiador.Tests -c Release --no-build 2>&1 | Tee-Object -FilePath "$logDirectory/tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publicar x64 y ARM64
        shell: pwsh
        run: |
          ./scripts/compilar.ps1 -Arquitectura win-x64 -SinPruebas
          ./scripts/compilar.ps1 -Arquitectura win-arm64 -SinPruebas
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: LimpiadorUltraWindows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - name: Conservar registros de compilación y pruebas
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Registros-verificacion-Windows
          path: artifacts/ci/*.log
          if-no-files-found: warn
      - name: Conservar fixtures propios si falla una prueba nativa
        if: failure() && env.LIMPIADOR_CI_FIXTURES != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Fixtures-fallo-Windows
          path: ${{ env.LIMPIADOR_CI_FIXTURES }}/Limpiador-native-tests-*/**
          if-no-files-found: ignore
          retention-days: 7
